name: Build Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Moraliys
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Buat keystore debug
        run: keytool -genkeypair -v -keystore app/persistent-debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - run: ./gradlew --console=plain :app:assembleFossDebug -x lint

      - uses: actions/upload-artifact@v4
        with:
          name: moraliys-debug-apk
          path: Moraliys/app/build/outputs/apk/foss/debug/*.apk
